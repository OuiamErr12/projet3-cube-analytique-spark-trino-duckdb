services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "/scripts/init-minio.sh"]
    volumes:
      - ./data:/project-data:ro
      - ./trino/init-minio.sh:/scripts/init-minio.sh:ro
    restart: "no"

  hive-metastore:
    image: apache/hive:4.1.0
    environment:
      SERVICE_NAME: metastore
    volumes:
      - hive-metastore-data:/opt/hive/data

  trino:
    image: trinodb/trino:476
    depends_on:
      hive-metastore:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8081:8080"
    volumes:
      - ./trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./trino/etc/node.properties:/etc/trino/node.properties:ro
      - ./trino/etc/catalog:/etc/trino/catalog:ro
      - ./trino:/project/trino:ro
      - trino-data:/data/trino

volumes:
  hive-metastore-data:
  minio-data:
  trino-data:
